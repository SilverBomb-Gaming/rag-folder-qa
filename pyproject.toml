[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-folder-qa"
version = "0.1.0"
description = "Local-first CLI that answers questions about a folder of notes, with citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alfredo Cardona" }]
keywords = ["rag", "ollama", "cli", "chroma", "citations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chromadb>=0.5.5,<1",
    # Chroma calls posthog.capture(distinct_id, event, properties). posthog 6+
    # changed that signature and logs an error on every query.
    "posthog>=2.4,<6",
    "httpx>=0.27",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rag-qa = "rag_folder_qa.cli:app"

[project.urls]
Homepage = "https://github.com/SilverBomb-Gaming/rag-folder-qa"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Accessing the 'model_fields' attribute:pydantic.warnings.PydanticDeprecatedSince211",
]
